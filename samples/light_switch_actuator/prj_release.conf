# Power-optimized release profile with no logs and shell.
# LEDs remain active and can be disabled for even more optimization.

# ETS commissioning.
CONFIG_KNX_IOT_ADD_ON=y
CONFIG_KNX_PROGRAMMING_MODE_AUTOSTART=n

# Sleepy End Device operation.
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=500
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y

# Automatically join a Commissioner-authorized Thread network.
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_JOINER_AUTOSTART=y
CONFIG_OPENTHREAD_JOINER_PSKD="N0RD1C"
CONFIG_OPENTHREAD_MANUAL_START=n

# Keep retained multicast echo messages within the available heap.
CONFIG_KNXIOT_ECHO_RING_SIZE=16

CONFIG_MAIN_STACK_SIZE=4096

# Persistent storage backend.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# User interface.
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

CONFIG_MBEDTLS_HEAP_SIZE=30000

# Keep picolibc allocations inside the linked image. The default -1 arena uses
# all RAM after _image_ram_end, which conflicts with power_down_unused_ram().
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# Disable the unused external flash bus. Firmware and settings use internal RRAM.
CONFIG_SPI=n
CONFIG_SPI_NOR=n

# Reduce power consumption while the CPU is idle.
CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_PM_DEVICE=y

# Disable unnecessary interfaces and diagnostics.
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_THREAD_NAME=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Optimize the release image size.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
