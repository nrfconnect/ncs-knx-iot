# Power-optimized release profile without logs or shell support.
# LEDs remain active and can be disabled for further optimization.

# Keep picolibc allocations inside the linked image. The default -1 arena uses
# all RAM after _image_ram_end, which conflicts with power_down_unused_ram().
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# Disable the unused external flash bus. Firmware and settings use internal RRAM.
CONFIG_SPI=n
CONFIG_SPI_NOR=n

# Power down unused RAM.
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Disable unnecessary interfaces and diagnostics.
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_THREAD_NAME=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Optimize the release image size.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
