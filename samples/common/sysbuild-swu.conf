# Build MCUboot so that the application can be updated through KNX IoT swu.
# MCUboot signs the application with its development key unless
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE points to a product key.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
