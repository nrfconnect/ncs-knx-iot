sample:
  name: KNX IoT Light Switch Sensor
  description: KNX IoT light switch sensor sample
common:
  sysbuild: true
  build_only: true
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  tags:
    - ci_build
tests:
  # Default: ETS6 commissioning + automatic Thread Joiner.
  samples.knx_iot.light_switch_sensor: {}
  samples.knx_iot.light_switch_sensor.release:
    extra_args:
      - FILE_SUFFIX=release
  samples.knx_iot.light_switch_sensor.knx_hardcoded:
    extra_args:
      - EXTRA_CONF_FILE=../common/overlay-knx-hardcoded.conf
  samples.knx_iot.light_switch_sensor.thread_hardcoded:
    extra_args:
      - EXTRA_CONF_FILE=../common/overlay-thread-hardcoded.conf
  samples.knx_iot.light_switch_sensor.thread_otshell:
    extra_args:
      - EXTRA_CONF_FILE=../common/overlay-thread-otshell.conf
  samples.knx_iot.light_switch_sensor.hardcoded:
    extra_args:
      - EXTRA_CONF_FILE=../common/overlay-knx-hardcoded.conf;../common/overlay-thread-hardcoded.conf
