sample:
  name: KNX IoT Certification
  description: KNX IoT EITT certification device sample
common:
  sysbuild: true
  build_only: true
  integration_platforms:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  platform_allow:
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54lc10dk/nrf54lc10a/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
  tags:
    - ci_build
tests:
  # Default: commissioning by the EITT + automatic Thread Joiner.
  samples.knx_iot.certification: {}
  samples.knx_iot.certification.thread_otshell:
    extra_args:
      - EXTRA_CONF_FILE=../common/overlay-thread-otshell.conf
  # MCUboot and KNX IoT software update. The nRF54LC10 slots are too small.
  samples.knx_iot.certification.swu:
    extra_args:
      - SB_EXTRA_CONF_FILE=../common/sysbuild-swu.conf
    platform_exclude:
      - nrf54lc10dk/nrf54lc10a/cpuapp
  samples.knx_iot.certification.verbose_logging:
    required_snippets:
      - knx-verbose-logging
