# MCUboot with DTS-defined partitions (see dts/knx_iot).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_PARTITION_MANAGER=n

# Overwrite-only mode with LZMA2-compressed update images, so that the
# secondary slot fits in internal RRAM.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y
