CONFIG_BOOT_WATCHDOG_FEED=n

# Without the tickless kernel, the SYSCOUNTER value after a software reset is not
# set properly, which delays the first system interrupt and increases reboot time.
CONFIG_TICKLESS_KERNEL=y

# Disable debug features.
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y

# The secondary slot resides in the internal RRAM, so external flash
# support is not needed.
CONFIG_SPI_NOR=n
CONFIG_SPI=n
